{%- set window = background | lighten(0.04) -%}
{%- set button = background | lighten(0.08) -%}
{%- set light = background | lighten(0.18) -%}
{%- set midlight = background | lighten(0.12) -%}
{%- set mid = background | lighten(0.06) -%}
{%- set muted = foreground | blend(background) -%}
{# Choose selection text using relative luminance, independently of the wallpaper background. #}
{%- set r = color4 | redf | float -%}
{%- set g = color4 | greenf | float -%}
{%- set b = color4 | bluef | float -%}
{%- set luminance = 0.2126 * (r / 12.92 if r <= 0.04045 else ((r + 0.055) / 1.055) ** 2.4)
                 + 0.7152 * (g / 12.92 if g <= 0.04045 else ((g + 0.055) / 1.055) ** 2.4)
                 + 0.0722 * (b / 12.92 if b <= 0.04045 else ((b + 0.055) / 1.055) ** 2.4) -%}
{%- set selection_text = "#000000" if luminance > 0.179 else "#FFFFFF" -%}
[ColorScheme]
# Qt role order: WindowText, Button, Light, Midlight, Dark, Mid, Text, BrightText,
# ButtonText, Base, Window, Shadow, Highlight, HighlightedText, Link, LinkVisited,
# AlternateBase, NoRole, ToolTipBase, ToolTipText, PlaceholderText.
active_colors={{foreground}}, {{button}}, {{light}}, {{midlight}}, {{background}}, {{mid}}, {{foreground}}, {{foreground}}, {{foreground}}, {{background}}, {{window}}, {{background | darken(0.5)}}, {{color4}}, {{selection_text}}, {{color4}}, {{color5}}, {{window}}, {{foreground}}, {{button}}, {{foreground}}, {{muted}}
disabled_colors={{muted}}, {{button}}, {{light}}, {{midlight}}, {{background}}, {{mid}}, {{muted}}, {{foreground}}, {{muted}}, {{background}}, {{window}}, {{background | darken(0.5)}}, {{color4}}, {{selection_text}}, {{color4}}, {{color5}}, {{window}}, {{foreground}}, {{button}}, {{muted}}, {{muted}}
inactive_colors={{foreground}}, {{button}}, {{light}}, {{midlight}}, {{background}}, {{mid}}, {{foreground}}, {{foreground}}, {{foreground}}, {{background}}, {{window}}, {{background | darken(0.5)}}, {{color4}}, {{selection_text}}, {{color4}}, {{color5}}, {{window}}, {{foreground}}, {{button}}, {{foreground}}, {{muted}}
