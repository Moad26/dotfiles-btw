[general]
default_module = "app"
empty_module = "a"
exec_cmd = "sh -c"
vi_mode = true
esc_to_abort = true
cheatsheet_entry = "?"
cheatsheet_viewer = "less -R; clear"
clear_screen_after_execution = false
loop_mode = false
external_editor = ""

[interface]
header = """
 \u001B[34;1m  >\u001B[0m $USER@$(hostname)                \u001B[31m\u001B[0m $(cat /proc/loadavg | cut -d ' ' -f 1)  \u001B[33m󰍛\u001B[0m $(free -h | awk 'FNR == 2 {print $3}' | sed 's/i//')
    \u001B[34;1m>\u001B[0;1m """
header_cmd = ""
header_cmd_trimmed_lines = 0
header_concatenate = false
list_prefix = "      "
selection_prefix = "    \u001B[31;1m> "
place_holder = "type and search"
default_module_message = "      \u001B[33msearch\u001B[0m the internet"
empty_module_message = ""
suggestion_mode = "list"
suggestion_lines = 12
indicator_with_arg_module = "\u001B[31m^\u001B[0m "
indicator_no_arg_module = "\u001B[31m$\u001B[0m "
prefix_padding = 3
prefix_color = "\u001B[33m"
description_color = "\u001B[39m"
place_holder_color = "\u001B[30m"
hint_color = "\u001B[30m"
move_right = 0
move_up = 0

[[modules]]
description = "search with Zen Browser"
prefix = "zen"
cmd = "setsid -f zen-beta 'https://duckduckgo.com/?q={}'"
with_argument = true
url_encode = true

[[modules]]
description = "kill a runing app"
prefix = "k"
cmd = 'ps -u "$USER" -o comm= | sort -u | fsel --dmenu | xargs -r pkill -9'
with_argument = true
url_encode = true

[[modules]]
description = "manage clipboard with cliphist"
prefix = "cl"
# cmd = "kitty -e sh -c 'cliphist list | fzf | cliphist decode | wl-copy'"
cmd = "cliphist list | fsel --dmenu | cliphist decode | wl-copy"

[[modules]]
description = "search NixOS packages"
prefix = "pm"
cmd = "setsid -f xdg-open 'https://search.nixos.org/packages?channel=unstable&query={}'"
with_argument = true
url_encode = true

[[modules]]
description = "test a package without installing"
prefix = "i"
cmd = "setsid -f kitty -e nix shell nixpkgs#{} -c {}"
with_argument = true

[[modules]]
description = "power menu with fzf"
prefix = "p"
cmd = """
power() {
if [[ -n $1 ]]; then
case $1 in
"logout") session=$(loginctl session-status | head -n 1 | awk '{print $1}'); loginctl terminate-session $session ;;
"suspend") systemctl suspend ;;
"hibernate") systemctl hibernate ;;
"reboot") systemctl reboot ;;
"shutdown") systemctl poweroff ;;
esac fi }
power $(printf "reboot\\nshutdown\\nlogout\\nsuspend\\nhibernate\\n" | fzf --reverse --no-scrollbar --padding 1,3 --prompt 'Power Menu: ' | tail -1)
"""

[[modules]]
description = "run command in terminal"
prefix = "s"
cmd = """
setsid -f "$(echo $TERM | sed 's/xterm-//g')" -e {}
"""
with_argument = true

[[modules]]
description = "search NixOS Wiki"
prefix = "w"
cmd = "setsid -f xdg-open 'https://wiki.nixos.org/w/index.php?search={}'"
with_argument = true
url_encode = true
