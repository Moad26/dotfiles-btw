# MangoWM interpretation of the Hyprland "fast" animation preset.
# Fast: MD3 pop-in and 350ms workspace transition
# These are approximate style ports, not byte-identical Hyprland behavior.
# Based on publicly recoverable Hyprland preset definitions.

animations=1
layer_animations=1

animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=slide
layer_animation_type_close=slide

animation_fade_in=1
animation_fade_out=1

zoom_initial_ratio=0.6
zoom_end_ratio=0.6
tag_animation_direction=1

animation_duration_move=300
animation_duration_open=300
animation_duration_close=300
animation_duration_tag=350
animation_duration_focus=0

animation_curve_open=0.05,0.7,0.1,1
animation_curve_close=0.05,0.7,0.1,1
animation_curve_move=0.05,0.7,0.1,1
animation_curve_tag=0.16,1,0.3,1
animation_curve_focus=0.46,1.0,0.29,1.0
