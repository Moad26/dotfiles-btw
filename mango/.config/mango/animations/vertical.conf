# MangoWM interpretation of the Hyprland "vertical" animation preset.
# Vertical: fast 150-ms zoom opening and vertical workspace transitions
# These are approximate style ports, not byte-identical Hyprland behavior.
# Based on publicly recoverable Hyprland preset definitions.

animations=1
layer_animations=1

animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=zoom
layer_animation_type_close=zoom

animation_fade_in=1
animation_fade_out=1

zoom_initial_ratio=0.6
zoom_end_ratio=0.6
tag_animation_direction=0

animation_duration_move=150
animation_duration_open=150
animation_duration_close=150
animation_duration_tag=300
animation_duration_focus=0

animation_curve_open=0.37,0,0.63,1
animation_curve_close=0.33,1,0.68,1
animation_curve_move=0.37,0,0.63,1
animation_curve_tag=0,0.2,0.4,1
animation_curve_focus=0.46,1.0,0.29,1.0
